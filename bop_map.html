      align-items: center;
      justify-content: center;

      background: #1a2a4a;

      color: #aabbcc;
      padding: 6px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;

      background: #1a4a80;
      color: #fff;
    }

      background: #2980b9;
      border-color: #3498db;
      color: #fff;
    }

      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: center;

  "Potential Wild":       "#9b59b6",
  "To Be Retired":        "#7f8c8d",
  "To be retired":        "#7f8c8d"
};

function getColor(status) {
  return statusColors[status] || "#e74c3c";
}

function makeMarker(site) {
  const color = getColor(site.status);
  return L.circleMarker([site.lat, site.lon], {
    radius: 7,
    fillColor: color,
    color: "#fff",
    weight: 1.5,
    opacity: 1,
    fillOpacity: 0.85
  });
}

// ── Map init ─────────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [40.72, -73.92],
  zoom: 10
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap contributors © CARTO',
  maxZoom: 19
}).addTo(map);

// ── Place markers ─────────────────────────────────────────────────────────────
sites.forEach(site => {
  const marker = makeMarker(site);
  marker.addTo(map);

  marker.bindPopup(`
    <div class="popup-title">${site.name}</div>
    <div class="popup-meta">
      ${site.waterbody}<br>
      ${site.status}${site.acres != null ? ' · ' + site.acres + ' ac' : ''}
    </div>
    <button class="popup-btn" onclick="openModal(${site.id})">
      View Model Output →
    </button>
  `);
});

// ── Modal logic ───────────────────────────────────────────────────────────────
let currentSiteId = null;
let currentYear   = "1993";

function openModal(siteId) {
  currentSiteId = siteId;
  const site = sites.find(s => s.id === siteId);

  document.getElementById('modal-title').textContent =
    `#${site.id} — ${site.name}`;
  document.getElementById('modal-meta').textContent =
    `${site.waterbody} · ${site.status}${site.acres != null ? ' · ' + site.acres + ' acres' : ''}`;

  // Reset to first year
  currentYear = "1993";
  document.querySelectorAll('.year-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.year === currentYear);
  });

  loadImage();
  document.getElementById('modal-overlay').classList.add('active');
  map.closePopup();
}

function loadImage() {
  const img = document.getElementById('site-image');
  const placeholder = document.getElementById('image-placeholder');
  const path = `images/HeatMap_Polygon_${currentSiteId}_${currentYear}.png`;

  img.style.display = 'none';
  placeholder.style.display = 'block';
  placeholder.innerHTML = '<div class="icon">⏳</div><div>Loading...</div>';

  img.onload = () => {
    img.style.display = 'block';
    placeholder.style.display = 'none';
  };

  img.onerror = () => {
    img.style.display = 'none';
    placeholder.innerHTML =
      `<div class="icon">📂</div>
       <div>Image not found:<br><code style="font-size:0.75rem;color:#aaa">${path}</code></div>`;
    placeholder.style.display = 'block';
  };

  img.src = path;
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  currentSiteId = null;
}

// Year tab buttons
document.querySelectorAll('.year-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentYear = btn.dataset.year;
    document.querySelectorAll('.year-btn').forEach(b =>
      b.classList.toggle('active', b === btn));
    if (currentSiteId !== null) loadImage();
  });
});

document.getElementById('modal-close').addEventListener('click', closeModal);

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
